# ============================================================================
# CI — build ویندوز G-code Studio (installer NSIS)
# ============================================================================
# چرا این workflow لازم است؟
# محیط اصلی ساخت این پروژه Linux است و تولید installer ویندوز فقط روی
# Windows runner ممکن است (الزام Docs/PROMPT_01: «اگر build روی غیر Windows
# است، تنظیمات/CI لازم برای build واقعی Windows را بساز و محدودیت build
# محلی را صریح بگو»).
#
# خروجی artefact: gcode-studio_x64_setup.exe (NSIS)
# توجه صداقت: اجرای «تست نصب روی Windows واقعی با اینترنت قطع» فقط
# دستی ممکن است و در این CI انجام نمی‌شود — در گزارش تحویل «اجرا‌نشده»
# ثبت شده است.
# ============================================================================

name: windows-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust core tests
        working-directory: src-tauri
        run: cargo test -p gcode-core

      - name: Build Windows installer (NSIS)
        run: npm run tauri build
        env:
          # نصب‌کنندهٔ آفلاین WebView2 داخل NSIS بسته‌بندی می‌شود
          # (webviewInstallMode=offlineInstaller در tauri.conf.json)
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcode-studio-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Summary
        shell: pwsh
        run: |
          Write-Host "installer آماده شد: src-tauri/target/release/bundle/nsis/"
          Write-Host "تست نصب آفلاین روی ویندوز واقعی باید دستی انجام شود."
