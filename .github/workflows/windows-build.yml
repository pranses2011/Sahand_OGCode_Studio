# ============================================================================
# CI — build ویندوز G-code Studio: دو نصب‌کنندهٔ NSIS + انتشار رلیز روی تگ v*
# ============================================================================
# چرا این workflow لازم است؟
# محیط اصلی ساخت این پروژه Linux است و تولید installer ویندوز فقط روی
# Windows runner ممکن است (الزام Docs/PROMPT_01: «اگر build روی غیر Windows
# است، تنظیمات/CI لازم برای build واقعی Windows را بساز و محدودیت build
# محلی را صریح بگو»).
#
# دو حالت:
#   push به main → build + آزمون + artifact (بدون رلیز)
#   push تگ v*   → build + آزمون + ساخت GitHub Release با «دو» فایل نصب
#
# خروجی‌ها (نسخهٔ ۱.۳ — درخواست کاربر: فایل نصب آپدیت سبک):
#   ۱) نصب کامل آفلاین  (~200MB): WebView2 داخل بسته — برای ویندوز بدون اینترنت
#   ۲) نصب آپدیت/سبک (~10-20MB): downloadBootstrapper — WebView2 فقط اگر
#      نصب نباشد دانلود می‌شود (روی ویندوز ۱۰/۱۱ به‌روز تقریباً همیشه
#      موجود است). برای به‌روزرسانی سریع به‌جای دانلود ۲۰۰MB.
#
# توجه صداقت: اجرای «تست نصب روی Windows واقعی با اینترنت قطع» فقط
# دستی ممکن است و در این CI انجام نمی‌شود — در گزارش تحویل «اجرا‌نشده»
# ثبت شده است.
# ============================================================================

name: windows-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # برای ساخت Release روی تگ‌ها

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust core tests
        working-directory: src-tauri
        run: cargo test -p gcode-core

      # ------------------------------------------------------------------
      # ۱) نصب کامل — WebView2 آفلاین داخل بسته (webviewInstallMode=offlineInstaller)
      # ------------------------------------------------------------------
      - name: Build full installer (offline WebView2)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Stage full installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "نصب کامل NSIS پیدا نشد" }
          New-Item -ItemType Directory -Force -Path "staging" | Out-Null
          Copy-Item $exe.FullName "staging/Sahand.GCode.Studio_full-setup.exe"
          Write-Host "full: $($exe.Name) → staging/Sahand.GCode.Studio_full-setup.exe ($([math]::Round($exe.Length/1MB,1)) MB)"

      # ------------------------------------------------------------------
      # ۲) نصب آپدیت/سبک — downloadBootstrapper (نسخهٔ ۱.۳؛ کد Rust همان
      #    است و cache کش شده → فقط مرحلهٔ bundle دوباره اجرا می‌شود)
      # ------------------------------------------------------------------
      - name: Build light/update installer (online WebView2 bootstrapper)
        run: npm run tauri build -- --config src-tauri/tauri.light.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Stage light installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "نصب سبک NSIS پیدا نشد" }
          Copy-Item $exe.FullName "staging/Sahand.GCode.Studio_light-setup.exe"
          Write-Host "light: $($exe.Name) → staging/Sahand.GCode.Studio_light-setup.exe ($([math]::Round($exe.Length/1MB,1)) MB)"

      - name: Upload installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcode-studio-windows-x64
          path: |
            staging/Sahand.GCode.Studio_full-setup.exe
            staging/Sahand.GCode.Studio_light-setup.exe
          if-no-files-found: error

      # ------------------------------------------------------------------
      # انتشار رلیز — فقط وقتی رویداد، تگ v* باشد
      # ------------------------------------------------------------------
      - name: Create GitHub Release with both installers
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $full = "staging/Sahand.GCode.Studio_full-setup.exe"
          $light = "staging/Sahand.GCode.Studio_light-setup.exe"
          if (-not (Test-Path $full)) { throw "نصب کامل پیدا نشد" }
          if (-not (Test-Path $light)) { throw "نصب سبک پیدا نشد" }
          Write-Host "full: $([math]::Round((Get-Item $full).Length/1MB,1)) MB | light: $([math]::Round((Get-Item $light).Length/1MB,1)) MB"

          # یادداشت رلیس فارسی صادقانه — دستی-اجرا‌نشده‌ها صریح ذکر می‌شوند
          $notes = @"
          # Sahand GCode Studio $tag

          > **طراح و نویسنده: سعید نجفی** · ۰۹۱۴۴۲۲۰۴۳۰ · Pranses2011@GMail.com · EA-Fixer.ir
          > 💚 حمایت از توسعه: کارت ۶۲۱۹۸۶۱۹۱۸۹۳۴۶۷۹ — بانک سامان

          دو نصب‌کننده ارائه می‌شود:

          | فایل | حجم تقریبی | مناسب چه کسی؟ |
          |---|---|---|
          | **full-setup.exe** (نصب کامل) | ~۲۰۰ MB | ویندوز بدون اینترنت — WebView2 داخل بسته است |
          | **light-setup.exe** (نصب آپدیت/سبک) | ~۱.۵ MB | به‌روزرسانی سریع — WebView2 فقط در صورت نبود، آنلاین دانلود می‌شود |

          💡 برای «آپدیت» نسخه‌های قبلی، همان light-setup.exe را نصب کنید — روی نسخهٔ موجود نصب می‌شود.

          ## آنچه در این نسخه است (۱.۷.۱ — رفع باگ‌های «متن به گلدان»)
          - 🐛 **رفع باگ اسکرول تنظیمات (مهم‌ترین)**: پنل تنظیمات صفحهٔ «متن به گلدان»
            اسکرول نمی‌شد و دکمه‌های «ذخیرهٔ G-code» و «ارسال به ویرایشگر» بیرون از
            دید می‌ماندند — کلاس designer-page در CSS تعریف نشده بود؛ اکنون پنل
            مستقل اسکرول می‌شود و دکمه‌های اقدام چسبان به پایین همیشه در دیدند
          - 🐛 **رفع باگ پیش‌نمایش ۳بعدی**: پیش‌نمایش به ارتفاع صفر فرو می‌افتاد و
            هیچ‌چیز نشان داده نمی‌شد — با همان ریشهٔ CSS رفع شد؛ اکنون مسیر چاپ
            واقعی (رشتهٔ سبز اکستروژن) رندر می‌شود
          - 🐛 **رفع مسیر IPC متن‌به‌گلدان**: محاسبه از مسیر استاندارد سه‌گانهٔ برنامه
            می‌گذرد (پوستهٔ دسکتاپ / پل توسعه / خطای صادقانه) + ترتیب پاسخ‌ها
            هنگام تایپ سریع تضمین شد (پاسخ کهنه پیش‌نمایش تازه را خراب نمی‌کند)
          - 🔤 **رفع مسابقهٔ فونت**: فونت انتخابی (مثل وزیرمتن باندل‌شده) قبل از
            استخراج کانتور بارگذاری می‌شود — اولین پیش‌نمایش دیگر از فونت جایگزین نمی‌آمد
          - و همهٔ قابلیت‌های ۱.۷: متن به گلدان vase-mode (فارسی RTL متصل + هر فونت
            ویندوزی + هم‌جوشی نامرئی حروف) · وزیرمتن embed · آیکون برند · توری/سوراخ
            دیواره‌دار · ۱۴ گلدان + ۸ الگو + ۸ بافت جدید · آویز و لامپ حرفه‌ای ·
            ایمیل SMTP مستقیم + تنظیمات ایمیل
          - و همهٔ قابلیت‌های ۱.۶: نمای جامد دقیق · اسپات زاویه‌ای · پایان‌بندی صحیح چاپ ·
            کیفیت G-code چهارسطحی · پالت ۳۷ دستوری · پروفایل شخصی پرینتر · ۱۰ الگوی کف

          ## نکات ایمنی (صداقت)
          - این برنامه صحت چاپ فیزیکی را تضمین نمی‌کند؛ فایل را با ابزار معتبر بازبینی کنید.
          - دماهای پریست مواد «شروع مناسب رایج» هستند نه عدد قطعی — به فیلامنت/دستگاه شما وابسته‌اند.
          - پریست‌های پرینتر «community» هستند: داده از صفحات رسمی سازنده، اما روی دستگاه
            توسط ما آزموده نشده‌اند.
          - ارسال بازخورد/گزارش خطا با SMTP مستقیم (تنظیمات ایمیل داخل برنامه) انجام می‌شود؛
            نیازمند اینترنت و پیکربندی یک‌بارهٔ SMTP است.
          - تست نصب روی ویندوز واقعی با اینترنت قطع (full) و اینترنت روشن (light)، دستی انجام
            نشده است (CI فقط build می‌سازد).

          ## آزمون‌ها
          - cargo test -p gcode-core: ۲۳۰ آزمون واحد — سبز در این CI
          - npm test (Vitest): ۷۷ آزمون — سبز در این CI
          "@

          gh release create $tag $full $light --title "Sahand GCode Studio $tag" --notes $notes
          Write-Host "رلیس $tag با دو نصب‌کننده منتشر شد."

      - name: Summary
        shell: pwsh
        run: |
          Write-Host "دو نصب‌کننده آماده شد: staging/Sahand.GCode.Studio_full-setup.exe + staging/Sahand.GCode.Studio_light-setup.exe"
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            Write-Host "رلیس ${{ github.ref_name }} با هر دو فایل نصب منتشر شد."
          } else {
            Write-Host "اجرای روی main: فقط artifact ساخته شد (رلیس فقط روی تگ v*)."
          }
          Write-Host "تست نصب آفلاین/آنلاین روی ویندوز واقعی باید دستی انجام شود."
