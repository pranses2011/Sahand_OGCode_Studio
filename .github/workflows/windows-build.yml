# ============================================================================
# CI — build ویندوز G-code Studio (installer NSIS) + انتشار رلیز روی تگ v*
# ============================================================================
# چرا این workflow لازم است؟
# محیط اصلی ساخت این پروژه Linux است و تولید installer ویندوز فقط روی
# Windows runner ممکن است (الزام Docs/PROMPT_01: «اگر build روی غیر Windows
# است، تنظیمات/CI لازم برای build واقعی Windows را بساز و محدودیت build
# محلی را صریح بگو»).
#
# دو حالت:
#   push به main → build + آزمون + artifact (بدون رلیز)
#   push تگ v*   → build + آزمون + ساخت GitHub Release با فایل نصب NSIS
#
# خروجی: gcode-studio_x64_setup.exe (NSIS با WebView2 آفلاین)
# توجه صداقت: اجرای «تست نصب روی Windows واقعی با اینترنت قطع» فقط
# دستی ممکن است و در این CI انجام نمی‌شود — در گزارش تحویل «اجرا‌نشده»
# ثبت شده است.
# ============================================================================

name: windows-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # برای ساخت Release روی تگ‌ها

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run Rust core tests
        working-directory: src-tauri
        run: cargo test -p gcode-core

      - name: Build Windows installer (NSIS)
        run: npm run tauri build
        env:
          # نصب‌کنندهٔ آفلاین WebView2 داخل NSIS بسته‌بندی می‌شود
          # (webviewInstallMode=offlineInstaller در tauri.conf.json)
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcode-studio-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # ------------------------------------------------------------------
      # انتشار رلیز — فقط وقتی رویداد، تگ v* باشد
      # ------------------------------------------------------------------
      - name: Create GitHub Release with installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "فایل نصب NSIS پیدا نشد" }
          Write-Host "installer: $($exe.FullName)"

          # یادداشت رلیس فارسی صادقانه — دستی-اجرا‌نشده‌ها صریح ذکر می‌شوند
          $notes = @"
          # G-code Studio $tag

          نصب‌کنندهٔ ویندوز (x64) با WebView2 آفلاین — بدون نیاز به اینترنت هنگام نصب.

          ## آنچه در این نسخه است
          - ویرایشگر G-code با تفسیر واقعی دولایه (lexer/interpreter) و توضیح فارسی هر خط
          - پیش‌نمایش سه‌بعدی مسیر نازل (Three.js/WebGL2) با همگام‌سازی دوطرفه خط↔segment
          - طراح مارپیچی ۵ گامی (پروفایل/الگو/بافت/کف/پرینتر) با ۹ الگوی هندسی و ۶ بافت مسیر
          - ۲۰ پریست پرینتر واقعی (Bambu Lab / Prusa / Creality / ...) — وضعیت community
          - ۸ تم رنگی و ۱۰ رنگ رشتهٔ چاپ در پیش‌نمایش
          - خروجی G-code و STL باینری + Save As بدون بازنویسی فایل مبدأ

          ## نکات ایمنی (صداقت)
          - این برنامه صحت چاپ فیزیکی را تضمین نمی‌کند؛ فایل را با ابزار معتبر بازبینی کنید.
          - پریست‌های پرینتر «community» هستند: داده از صفحات رسمی سازنده، اما روی دستگاه
            توسط ما آزموده نشده‌اند.
          - تست نصب روی ویندوز واقعی با اینترنت قطع، دستی انجام نشده است (CI فقط build می‌سازد).

          ## آزمون‌ها
          - cargo test -p gcode-core: 127 آزمون واحد — سبز در این CI
          - npm test (Vitest): 14 آزمون — سبز در این CI
          "@

          gh release create $tag $exe.FullName --title "G-code Studio $tag" --notes $notes
          Write-Host "رلیس $tag منتشر شد."

      - name: Summary
        shell: pwsh
        run: |
          Write-Host "installer آماده شد: src-tauri/target/release/bundle/nsis/"
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            Write-Host "رلیس ${{ github.ref_name }} با فایل نصب منتشر شد."
          } else {
            Write-Host "اجرای روی main: فقط artifact ساخته شد (رلیس فقط روی تگ v*)."
          }
          Write-Host "تست نصب آفلاین روی ویندوز واقعی باید دستی انجام شود."
