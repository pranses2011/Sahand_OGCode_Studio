# ============================================================================
# gcode-core — هستهٔ محاسباتی استودیوی G-code
# ============================================================================
# این crate «منبع واحد حقیقت» برنامه است:
#   - lexer/parser G-code و مفسر وضعیت modal؛
#   - Toolpath IR مشترک (پیش‌نمایش و خروجی از یک داده ساخته می‌شوند)؛
#   - موتور طراح مارپیچی (پروفایل/الگو/بافت/کف/اسپیرال)؛
#   - تولید خروجی G-code و STL و فایل پروژهٔ JSON.
#
# قاعدهٔ معماری: هیچ وابستگی به Tauri/WebView/فایل‌سیستم نداریم؛
# ورودی‌ها متن/پارامترند و خروجی‌ها دادهٔ سریال‌شونده. به همین دلیل
# «cargo test -p gcode-core» روی هر پلتفرمی بدون GUI اجرا می‌شود.
# ============================================================================

[package]
name = "gcode-core"
version = "1.7.1"
description = "هستهٔ parser، مفسر و طراح مارپیچی G-code — خالص و قابل‌آزمون"
edition = "2021"
rust-version = "1.77"

[dependencies]
# serde فقط برای شکل‌دادن به دادهٔ خروجی IPC؛ هسته خودش I/O انجام نمی‌دهد
serde = { version = "1", features = ["derive"] }
# برای سریال‌سازی snapshot وضعیت در LineDetail (ipc)
serde_json = "1"

[dev-dependencies]
# برای آزمون‌های round-trip پروژه/IR (حالا زیر dependencies هم هست؛ نگه‌داشته
# می‌شود برای سازگاری اسکریپت‌های موجود)
serde_json = "1"
