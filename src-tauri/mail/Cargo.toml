[package]
name = "gcode-mail"
version = "1.7.1"
description = "ارسال ایمیل SMTP مستقیم — بازخورد و گزارش خطای Sahand GCode Studio"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "rustls-tls",
] }
